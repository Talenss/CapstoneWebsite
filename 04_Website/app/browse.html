<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Openings — ResumeMatch PH</title>
<meta name="description" content="Every open position at Royce Hotel & Casino, Clark Freeport Zone — scored against your resume.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/styles.css">
<style>
  .filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px;align-items:center}
  .filters input,.filters select{padding:10px 13px;border:1px solid var(--rule);border-radius:var(--r);
    font-family:var(--body);font-size:13.5px;background:var(--paper)}
  .filters input{flex:1;min-width:230px}
  .filters .count{margin-left:auto;font-size:12.5px;color:var(--muted);white-space:nowrap}
  .job{display:flex;flex-direction:column;gap:13px}
  .job .top{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}
  .job h3{font-size:19px;line-height:1.25}
  .job .co{font-size:12.5px;color:var(--muted);margin-top:4px}
  .job .desc{font-size:13px;color:var(--muted);line-height:1.6}
  .job .req{display:flex;gap:16px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
  .job .req b.ok{color:var(--emerald)} .job .req b.no{color:var(--gold-deep)}
  .job .foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:auto;padding-top:4px}
  .job .foot span{font-size:12.5px;color:var(--muted)}
</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>

<header class="site-header">
  <div class="container">
    <a class="brand" href="index.html"><span class="mark">R</span><span class="word">Resume<em>Match</em><small>Philippines</small></span></a>
    <nav class="nav-links" id="nav" aria-label="Main">
      <a href="seeker-dashboard.html" id="navDash">Dashboard</a>
      <a href="browse.html" class="active">Openings</a>
      <a href="my-resumes.html" id="navRes">My resumes</a>
      <a href="learning-hub.html">Learning hub</a>
    </nav>
    <div class="nav-cta" data-auth-cta>
      <a class="btn ghost sm" href="auth.html">Log in</a>
      <a class="btn primary sm" href="auth.html#register">Create free account</a>
    </div>
    <button class="menu-btn" aria-expanded="false" aria-controls="nav" aria-label="Open menu">☰</button>
  </div>
  <div class="bar"></div>
</header>

<main id="main" class="container" style="padding-bottom:80px">
  <div class="page-head">
    <span class="eyebrow">Royce Hotel &amp; Casino &middot; Clark Freeport Zone</span>
    <h1>Open positions</h1>
    <p id="sub">Every posting here is a real vacancy, posted by the hotel's own HR staff.</p>
  </div>

  <div class="alert info" id="noResume" style="margin-bottom:22px" role="status"></div>

  <div class="filters">
    <input type="search" id="q" placeholder="Search by title, department, or skill" aria-label="Search openings">
    <select id="dept" aria-label="Filter by department"><option value="">All departments</option></select>
    <select id="sort" aria-label="Sort openings">
      <option value="score">Best match first</option>
      <option value="new">Newest first</option>
      <option value="az">A to Z</option>
    </select>
    <span class="count" id="count"></span>
  </div>

  <div id="list"><div class="loading"><span class="spinner"></span> Loading openings…</div></div>
</main>

<!-- apply -->
<div class="modal-back" id="modal" role="dialog" aria-modal="true" aria-labelledby="mT">
  <div class="modal">
    <button class="close-x" id="mX" type="button" aria-label="Close">&times;</button>
    <div class="modal-head">
      <h3 id="mT"></h3>
      <p class="sub" id="mCo"></p>
    </div>
    <div class="modal-body">
      <div id="mScored">
        <div style="display:flex;align-items:center;gap:18px">
          <span class="score-ring lg" id="mRing" style="--p:0"><b></b></span>
          <div>
            <div id="mTier" class="badge" style="margin-bottom:7px"></div>
            <div style="font-size:13px;color:var(--muted)">Your resume: <b id="mResume" style="color:var(--ink)"></b></div>
          </div>
        </div>
      </div>
      <p id="mDesc" style="font-size:14px;background:var(--ivory);border-radius:var(--r);padding:14px 16px;margin:16px 0"></p>
      <div id="mReqs" style="margin-bottom:14px"></div>
      <div class="breakdown" id="mBreak"></div>
    </div>
    <div class="modal-foot">
      <button class="btn ghost" id="mCancel" type="button">Close</button>
      <span id="mAction"></span>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="assets/api.js"></script>
<script>
(async function () {
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const toast = m => { const t = $('#toast'); t.textContent = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3000); };
  const W = RMPH.WEIGHTS;

  // Browsing is open to everyone. Scoring needs a resume; applying needs an account.
  const meRes = await RMPH.auth.me();
  const me = meRes.ok ? meRes.user : null;
  const isSeeker = me && me.role === 'seeker';

  if (!me) {
    ['#navDash','#navRes'].forEach(s => $(s).remove());
  }

  let resume = null, appliedTo = [];
  if (isSeeker) {
    const [rRes, aRes] = await Promise.all([RMPH.resumes.mine(), RMPH.applications.mine()]);
    const list = rRes.ok ? rRes.resumes : [];
    resume = list.find(r => r.id === me.activeResumeId) || list[0] || null;
    appliedTo = (aRes.applications || []).map(a => a.postingId);
  }

  const note = $('#noResume');
  if (!me) {
    note.innerHTML = 'You\u2019re browsing as a guest. <a href="auth.html#register">Create a free account</a> to see how your resume scores against each of these and to apply.';
    note.classList.add('show');
  } else if (isSeeker && !resume) {
    note.innerHTML = 'You don\u2019t have a resume yet, so these can\u2019t be scored. <a href="resume-builder.html">Build one</a> \u2014 it takes a few minutes, and browsing stays open below.';
    note.classList.add('show');
  }

  const pRes = await RMPH.postings.open();
  const postings = pRes.ok ? pRes.postings : [];

  // score each one (locally — the engine is identical on both sides)
  const rows = postings.map(p => {
    const s = resume ? RMPH.scoreLocal(resume, p) : null;
    return { posting:p, company:p.company, s, applied: appliedTo.indexOf(p.id) !== -1 };
  });

  const depts = Array.from(new Set(postings.map(p => p.department))).sort();
  $('#dept').innerHTML += depts.map(d => '<option value="' + esc(d) + '">' + esc(d) + '</option>').join('');
  $('#sub').textContent = postings.length + ' open position' + (postings.length === 1 ? '' : 's') +
    ' at Royce Hotel & Casino \u2014 every one posted by their own HR staff.';
  if (!resume) $('#sort').querySelector('option[value="score"]').remove();

  function card(row) {
    const { posting: p, company, s, applied } = row;
    const el = document.createElement('article');
    el.className = 'card job';
    el.innerHTML =
      '<div class="top">' +
        '<div><h3>' + esc(p.title) + '</h3><div class="co">' + esc(company.name) + ' \u00b7 ' + esc(p.department) + '</div></div>' +
        (s ? '<span class="score-ring" style="--p:' + s.score + ';--c:' + RMPH.tierColor(s.score) + '"><b>' + s.score + '%</b></span>' : '') +
      '</div>' +
      '<p class="desc">' + esc(p.description) + '</p>' +
      '<div>' + p.skills.map(sk =>
        '<span class="chip' + (s && s.matchedSkills.indexOf(sk) !== -1 ? '' : s ? ' miss' : '') + '">' + esc(sk) + '</span>').join('') + '</div>' +
      '<div class="req">' +
        '<span>' + esc(RMPH.EDU_LABELS[p.educationLevel]) + '</span>' +
        '<span>' + (p.minExperienceMonths ? p.minExperienceMonths + ' months experience' : 'No experience required') + '</span>' +
      '</div>' +
      '<div class="foot">' +
        '<span>' + (s ? s.matchedSkills.length + ' of ' + p.skills.length + ' skills' : p.skills.length + ' skills asked for') + '</span>' +
        (applied ? '<span class="badge slate">Applied</span>' : '<button class="btn primary sm" type="button">View</button>') +
      '</div>';
    const b = el.querySelector('button');
    if (b) b.addEventListener('click', () => open(row));
    return el;
  }

  function render() {
    const q = $('#q').value.trim().toLowerCase();
    const d = $('#dept').value;
    const sort = $('#sort').value;

    let out = rows.filter(r => {
      const p = r.posting;
      if (d && p.department !== d) return false;
      if (!q) return true;
      return (p.title + ' ' + p.department + ' ' + p.description + ' ' + p.skills.join(' ')).toLowerCase().indexOf(q) !== -1;
    });

    out.sort((a, b) =>
      sort === 'az'  ? a.posting.title.localeCompare(b.posting.title) :
      sort === 'new' ? b.posting.createdAt - a.posting.createdAt :
      (b.s ? b.s.score : 0) - (a.s ? a.s.score : 0));

    $('#count').textContent = out.length + ' of ' + rows.length + ' shown';

    const wrap = $('#list');
    wrap.innerHTML = '';
    if (!out.length) {
      wrap.innerHTML = '<div class="card empty"><h2>Nothing matches that</h2><p>Try a different word, or clear the department filter.</p></div>';
      return;
    }
    const grid = document.createElement('div');
    grid.className = 'grid cols-3';
    out.forEach(r => grid.appendChild(card(r)));
    wrap.appendChild(grid);
  }

  ['#q','#dept','#sort'].forEach(sel => $(sel).addEventListener('input', render));

  /* ---------- detail / apply ---------- */
  let current = null;
  function open(row) {
    current = row;
    const { posting: p, company, s } = row;
    $('#mT').textContent = p.title;
    $('#mCo').textContent = company.name + ' \u00b7 ' + p.department;
    $('#mDesc').textContent = p.description;

    $('#mReqs').innerHTML =
      '<span class="badge slate">' + esc(RMPH.EDU_LABELS[p.educationLevel]) + '</span> ' +
      '<span class="badge slate">' + (p.minExperienceMonths ? p.minExperienceMonths + ' months experience' : 'No experience required') + '</span> ' +
      '<span class="badge slate">' + esc(p.employmentType || 'full-time') + '</span>';

    if (s) {
      $('#mScored').style.display = '';
      const ring = $('#mRing');
      ring.style.setProperty('--p', s.score);
      ring.style.setProperty('--c', RMPH.tierColor(s.score));
      ring.querySelector('b').textContent = s.score + '%';
      const tier = $('#mTier');
      const t = RMPH.tierOf(s.score);
      tier.className = 'badge ' + (t === 'strong' ? 'green' : t === 'possible' ? 'gold' : 'slate');
      tier.textContent = RMPH.tierLabel(s.score);
      $('#mResume').textContent = resume.title;

      $('#mBreak').innerHTML =
        '<div class="row"><span><b>Skills matched</b><span class="w">' + (W.skills * 100) + '% of the score</span></span>' +
          '<b>' + s.matchedSkills.length + ' of ' + p.skills.length + (s.missingSkills.length ? ' \u2014 missing: ' + s.missingSkills.map(esc).join(', ') : '') + '</b></div>' +
        '<div class="row"><span><b>Education</b><span class="w">' + (W.education * 100) + '% of the score</span></span>' +
          '<b style="color:' + (s.eduMeets ? 'var(--emerald)' : 'var(--gold-deep)') + '">' + (s.eduMeets ? 'Meets' : 'Below') + ' ' + esc(RMPH.EDU_LABELS[p.educationLevel]) + '</b></div>' +
        '<div class="row"><span><b>Experience</b><span class="w">' + (W.experience * 100) + '% of the score</span></span>' +
          '<b style="color:' + (s.expMeets ? 'var(--emerald)' : 'var(--gold-deep)') + '">' + s.seekerMonths + ' mo \u00b7 asks for ' + (p.minExperienceMonths || 0) + ' mo</b></div>' +
        '<div class="row"><span><b>If your score is low</b></span><b style="font-weight:500;color:var(--muted)">You still appear on the recruiter\u2019s list.</b></div>';
    } else {
      $('#mScored').style.display = 'none';
      $('#mBreak').innerHTML =
        '<div class="row"><span><b>Skills asked for</b></span><b>' + p.skills.map(esc).join(', ') + '</b></div>' +
        '<div class="row"><span><b>How scoring works</b></span><b style="font-weight:500;color:var(--muted)">Skills ' + (W.skills*100) + '% \u00b7 education ' + (W.education*100) + '% \u00b7 experience ' + (W.experience*100) + '%</b></div>';
    }

    const act = $('#mAction');
    if (!me)              act.innerHTML = '<a class="btn primary" href="auth.html#register">Create an account to apply</a>';
    else if (!isSeeker)   act.innerHTML = '<span style="font-size:13px;color:var(--muted)">Recruiter accounts can\u2019t apply.</span>';
    else if (!resume)     act.innerHTML = '<a class="btn primary" href="resume-builder.html">Build a resume to apply</a>';
    else if (row.applied) act.innerHTML = '<span class="badge slate">Already applied</span>';
    else                  act.innerHTML = '<button class="btn primary" id="doApply" type="button">Apply now</button>';

    const go = $('#doApply');
    if (go) go.addEventListener('click', async () => {
      go.disabled = true; go.innerHTML = '<span class="spinner"></span> Sending…';
      const res = await RMPH.applications.apply(resume.id, p.id);
      if (!res.ok) { go.disabled = false; go.textContent = 'Apply now'; toast(res.error); return; }
      row.applied = true; appliedTo.push(p.id);
      close(); render();
      toast('Applied to ' + p.title + '. Follow it on your dashboard.');
    });

    $('#modal').classList.add('show');
  }
  const close = () => { $('#modal').classList.remove('show'); current = null; };
  $('#mX').addEventListener('click', close);
  $('#mCancel').addEventListener('click', close);
  $('#modal').addEventListener('click', e => { if (e.target === e.currentTarget) close(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });

  render();
})();
</script>
</body>
</html>
