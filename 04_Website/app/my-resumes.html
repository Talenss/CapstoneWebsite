<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My resumes — ResumeMatch PH</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/styles.css">
<style>
  .r-card{display:flex;flex-direction:column;gap:0;padding:0;overflow:hidden}
  .r-card .top{padding:20px 22px;border-bottom:1px solid var(--rule-2)}
  .r-card h3{font-size:20px;line-height:1.25}
  .r-card .meta{font-size:12px;color:var(--muted);margin-top:5px}
  .r-card .body{padding:18px 22px;flex:1}
  .r-card .body p{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:12px}
  .r-card .foot{display:flex;gap:8px;padding:14px 22px;background:var(--ivory);border-top:1px solid var(--rule-2);flex-wrap:wrap}
  .r-card.active-r{border-top:2px solid var(--gold)}
  .facts{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:10px}
  .facts b{color:var(--ink)}
  .new{display:grid;place-items:center;border:1px dashed var(--rule);border-radius:var(--r-lg);background:transparent;
    min-height:230px;text-decoration:none;color:var(--muted);font-weight:600;font-size:14px;transition:.15s;text-align:center;padding:24px}
  .new:hover{border-color:var(--gold);color:var(--gold-deep);background:var(--gold-wash)}
  .new span{display:block;font-family:var(--display);font-size:32px;color:var(--gold);margin-bottom:8px;line-height:1}
</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>

<header class="site-header">
  <div class="container">
    <a class="brand" href="index.html"><span class="mark">R</span><span class="word">Resume<em>Match</em><small>Philippines</small></span></a>
    <nav class="nav-links" id="nav" aria-label="Main">
      <a href="seeker-dashboard.html">Dashboard</a>
      <a href="browse.html">Openings</a>
      <a href="my-resumes.html" class="active">My resumes</a>
      <a href="resume-builder.html">Builder</a>
      <a href="learning-hub.html">Learning hub</a>
    </nav>
    <div class="nav-cta">
      <span class="whoami" data-whoami></span>
      <button class="btn primary sm" type="button" data-logout>Log out</button>
    </div>
    <button class="menu-btn" aria-expanded="false" aria-controls="nav" aria-label="Open menu">☰</button>
  </div>
  <div class="bar"></div>
</header>

<main id="main" class="container" style="padding-bottom:80px">
  <div class="page-head head-row">
    <div>
      <span class="eyebrow">Resume library</span>
      <h1>My resumes</h1>
      <p>Keep a version for each kind of role. The <b>active</b> one is what gets scored on your dashboard and sent when you apply.</p>
    </div>
    <a class="btn primary" href="resume-builder.html">+ New resume</a>
  </div>

  <div id="wrap"><div class="loading"><span class="spinner"></span> Loading your resumes…</div></div>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="assets/api.js"></script>
<script>
(async function () {
  const user = await RMPH.guard('seeker');
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const toast = m => { const t = $('#toast'); t.textContent = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3400); };
  const day = ts => new Date(ts).toLocaleDateString('en-PH', { month:'short', day:'numeric', year:'numeric' });

  async function render() {
    const [res, me, apps] = await Promise.all([RMPH.resumes.mine(), RMPH.auth.me(), RMPH.applications.mine()]);
    const list = res.ok ? res.resumes : [];
    const activeId = me.user.activeResumeId;
    const used = {};
    (apps.applications || []).forEach(a => { used[a.resumeId] = (used[a.resumeId] || 0) + 1; });

    const wrap = $('#wrap');

    if (!list.length) {
      wrap.innerHTML =
        '<div class="card empty crest">' +
          '<h2>No resumes yet</h2>' +
          '<p>Build one and the system will score it against every open position at Royce — and show you which roles you nearly fit, not just the ones you already do.</p>' +
          '<a class="btn primary" href="resume-builder.html">Start the guided builder</a>' +
        '</div>';
      return;
    }

    const grid = document.createElement('div');
    grid.className = 'grid cols-3';

    list.forEach(r => {
      const isActive = r.id === activeId;
      const months = (r.experience || []).reduce((t, e) => t + (Number(e.months) || 0), 0);
      const nUsed = used[r.id] || 0;

      const el = document.createElement('article');
      el.className = 'card r-card' + (isActive ? ' active-r' : '');
      el.innerHTML =
        '<div class="top">' +
          '<div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start">' +
            '<h3>' + esc(r.title) + '</h3>' +
            (isActive ? '<span class="badge gold">Active</span>' : '') +
          '</div>' +
          '<div class="meta">' + esc(r.template[0].toUpperCase() + r.template.slice(1)) + ' \u00b7 updated ' + day(r.updatedAt) + '</div>' +
        '</div>' +
        '<div class="body">' +
          '<div class="facts">' +
            '<span><b>' + (r.skills || []).length + '</b> skills</span>' +
            '<span><b>' + (r.education || []).length + '</b> education</span>' +
            '<span><b>' + months + '</b> mo experience</span>' +
          '</div>' +
          (r.ownFile
            ? '<p><span class="clip">&#128206;</span> <b>' + esc(r.ownFile.name) + '</b> attached \u2014 recruiters read it, the engine never scores it.</p>'
            : '<p>No file attached. You can add your own resume document in the builder\u2019s last step.</p>') +
          (nUsed ? '<span class="badge slate">Sent with ' + nUsed + ' application' + (nUsed > 1 ? 's' : '') + '</span>' : '') +
        '</div>' +
        '<div class="foot">' +
          (isActive ? '' : '<button class="btn ghost sm" data-act type="button">Make active</button>') +
          '<a class="btn ghost sm" href="resume-builder.html?id=' + r.id + '">Edit</a>' +
          '<a class="btn ghost sm" href="resume-print.html?id=' + r.id + '" target="_blank" rel="noopener">PDF</a>' +
          '<button class="btn ghost sm" data-dup type="button">Duplicate</button>' +
          '<button class="btn warn sm" data-del type="button" style="margin-left:auto">Delete</button>' +
        '</div>';

      const act = el.querySelector('[data-act]');
      if (act) act.addEventListener('click', async () => {
        await RMPH.resumes.setActive(r.id);
        await render();
        toast('"' + r.title + '" is now your active resume.');
      });

      el.querySelector('[data-dup]').addEventListener('click', async () => {
        const d = await RMPH.resumes.duplicate(r.id);
        if (!d.ok) { toast(d.error); return; }
        await render();
        toast('Copied. The uploaded file isn\u2019t carried over — attach it again if you want it.');
      });

      el.querySelector('[data-del]').addEventListener('click', async () => {
        if (!confirm('Delete "' + r.title + '"? This can\u2019t be undone.')) return;
        const d = await RMPH.resumes.remove(r.id);
        if (!d.ok) { toast(d.error); return; }
        await render();
        toast('Resume deleted.');
      });

      grid.appendChild(el);
    });

    const add = document.createElement('a');
    add.className = 'new';
    add.href = 'resume-builder.html';
    add.innerHTML = '<span>+</span>New resume';
    grid.appendChild(add);

    wrap.innerHTML = '';
    wrap.appendChild(grid);
  }

  await render();
})();
</script>
</body>
</html>
