# ============================================================
# ResumeMatch PH — Netlify configuration
# ------------------------------------------------------------
# WHICH BUILD THIS DEPLOYS, AND WHY IT MATTERS
#
# Netlify is a static host: it serves files, it does not run our
# Node/Express server. So this deploys the DEMO build, which runs
# entirely in the browser (localStorage) and needs no API and no
# database.
#
#   npm run build:demo   →  browser-only. Works on Netlify.
#   npm run build        →  API mode. Would deploy, then every
#                           /api call would 404 — login fails and
#                           the site looks broken. Do not use it
#                           here.
#
# To put the FULL system online (real accounts, real database) the
# front end alone is not enough: the Express server has to run
# somewhere that executes Node (Render, Railway, Fly.io …) against
# a Supabase database, and the client has to be built to point at
# it. See SETUP.md.
# ============================================================

[build]
  # Everything below is relative to this directory.
  base    = "05_Website_Angular/client"
  command = "npm ci && npm run build:demo"
  publish = "dist/client/browser"

[build.environment]
  NODE_VERSION = "22"

  # SITE_URL is what writes sitemap.xml and fills in the Sitemap: line of
  # robots.txt. It is COMMENTED OUT because this repository does not know
  # the site's final domain, and a sitemap full of URLs on the wrong domain
  # is worse than no sitemap at all — every URL in it would 404.
  #
  # Uncomment with the real domain (no trailing slash) once it is settled.
  # Everything else — canonical tags, Open Graph URLs — is taken from the
  # browser's own origin at runtime and needs nothing here.
  #
  # SITE_URL = "https://your-domain"

# ---- SPA routing -------------------------------------------
# Angular does its own routing in the browser, so /browse and
# /auth are not files on disk. Without this rule a static host
# returns 404 for every route except "/" — which means any deep
# link, and any page refresh, is a 404. Verified: on a plain
# static server /browse and /auth both return 404 before this
# rule and 200 after it.
#
# status = 200 (a rewrite, not a redirect) so the URL the visitor
# typed stays in the address bar for Angular to read.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# ---- Security headers --------------------------------------
# In full mode the Express server sends these via helmet. Netlify
# serves the files directly, so the same protections have to be
# declared here or the deployed site would have none.
#
# The CSP mirrors the server's, which is already proven against
# this exact bundle. Note what demo mode genuinely needs:
#   · data: and blob: in img/frame — an uploaded résumé is held as
#     a data: URL in localStorage and previewed in an <iframe>
#   · 'unsafe-inline' for styles — Angular's style bindings
#   · Google Fonts for the display/body typefaces
# script-src stays 'self' with no 'unsafe-inline': the build is
# checked by scripts/check-csp-safe.mjs to contain no inline
# handlers, so nothing legitimate needs the exception.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; frame-src 'self' data: blob:; object-src 'none'; base-uri 'self'; form-action 'self'"
    X-Content-Type-Options  = "nosniff"
    X-Frame-Options         = "SAMEORIGIN"
    Referrer-Policy         = "strict-origin-when-cross-origin"

# Hashed build assets are immutable — safe to cache hard.
# index.html must NOT be, or visitors keep getting the old app.
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
