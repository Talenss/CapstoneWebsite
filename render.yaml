# ============================================================
# Linaw PH — Render blueprint
# ------------------------------------------------------------
# This deploys the FULL system: the Express API and the Angular
# app in api mode, served together from one origin.
#
# One origin is not a preference. The session cookie is
# sameSite: 'lax', so splitting the front end onto a second
# domain would stop the browser sending it on API calls and
# login would fail with no visible error. server.ts serves the
# client's build itself, which is why there is one service here
# and not two.
#
# The browser-only demo build is a separate thing and stays on
# Vercel (see 05_Website_Angular/DEPLOY.md). It needs no server.
#
# Values marked `sync: false` are NOT stored in this file —
# Render prompts for them once, in the dashboard, when the
# blueprint is first created. Secrets do not belong in a repo.
# ============================================================
services:
  - type: web
    name: linaw-ph
    runtime: node
    plan: free
    region: singapore # closest region to Angeles City
    healthCheckPath: /api/health
    # --include=dev is load-bearing. NODE_ENV below is production, which
    # makes npm ci omit devDependencies — and the compilers live there:
    # @angular/cli provides 'ng', and typescript provides 'tsc'. Without
    # it the build fails at "ng: not found".
    buildCommand: cd 05_Website_Angular/server && npm ci --include=dev && npm run build:deploy
    startCommand: cd 05_Website_Angular/server && npm start
    envVars:
      # ---- pinned, because there is no package.json at the repo root
      # for Render to read engines.node from ----
      - key: NODE_VERSION
        value: "22"

      # Belt and braces with the dns.setDefaultResultOrder call in config.ts.
      # Render has no outbound IPv6, and Node will happily try an AAAA record
      # it can never reach — which is how every verification email failed with
      # ENETUNREACH on an IPv6 address for smtp.gmail.com. This applies from
      # process start, before any module is loaded.
      - key: NODE_OPTIONS
        value: --dns-result-order=ipv4first

      # ---- the three the server refuses to start without ----
      # NODE_ENV=production turns on that check. See config.ts.
      - key: NODE_ENV
        value: production
      - key: DEBUG
        value: "false" # on, this returns email verification codes in API responses
      - key: COOKIE_SECURE
        value: "true" # Render terminates TLS, so the cookie is HTTPS-only
      # Render generates a random 256-bit value on first deploy, so the
      # signing key is never one a human chose or a repository has seen.
      - key: SESSION_SECRET
        generateValue: true

      # Render is a proxy: without this, every request looks like it came
      # from the proxy and the rate limiters would throttle all users as one.
      - key: TRUST_PROXY
        value: "true"

      # ---- database (Supabase session pooler, port 5432) ----
      - key: DATABASE_URL
        sync: false

      # ---- uploaded resume files ----
      # Render's disk is ephemeral: without these, every redeploy silently
      # empties the uploads folder while the rows pointing at it survive.
      # The bucket must be PRIVATE — routes/file.ts authorises every read.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: resumes

      # ---- email (Gmail app password) ----
      # Render's FREE instances block outbound SMTP on 25, 465 and 587, so
      # no SMTP provider works there — the send times out, which reads like a
      # bad password and is not one. BREVO_API_KEY makes the mailer post over
      # HTTPS instead, which is not blocked. Leave it empty and set SMTP_* if
      # this ever runs on a paid instance or another host.
      - key: BREVO_API_KEY
        sync: false
      - key: SMTP_HOST
        value: ""
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false # the 16-character app password, spaces removed
      - key: MAIL_FROM
        sync: false

      # APP_URL is deliberately absent: config.ts falls back to
      # RENDER_EXTERNAL_URL, which Render sets to this service's own https
      # URL. Add it by hand only when a custom domain replaces onrender.com.

      # ---- sitemap ----
      # SITE_URL is read at BUILD time by scripts/make-sitemap.mjs, which is
      # why it cannot use the same RENDER_EXTERNAL_URL fallback the server
      # gets at run time: the build has not been assigned a URL yet.
      # Without it the build logs "SITE_URL not set" and ships no sitemap,
      # and strips the Sitemap: line out of robots.txt. That is the safe
      # default rather than a bug — a sitemap full of URLs on the wrong
      # domain is worse than none, because every entry 404s.
      # Set explicitly here so the deployed site actually publishes one.
      # CHANGE THIS when a custom domain replaces onrender.com, or the
      # sitemap will advertise the old host.
      - key: SITE_URL
        value: https://linaw-ph.onrender.com

      # ---- resume reading ----
      - key: RESUME_EXTRACTOR
        value: escalate # rules first; the model only when the reading is thin
      - key: GEMINI_API_KEY
        sync: false
