name: CI

# Builds the Angular client and type-checks + tests the Node server on every
# push to main and every pull request. All jobs are database-free (the engine
# tests don't touch a DB), so nothing external is needed to go green.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  client:
    name: Client — build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: 05_Website_Angular/client/package-lock.json
      - name: Install dependencies
        working-directory: 05_Website_Angular/client
        run: npm ci
      # `npm run build` ends with the CSP guard (scripts/check-csp-safe.mjs),
      # which fails if the shipped index.html carries an inline event handler
      # or a stylesheet pinned to media="print". Both are silently fatal under
      # the server's Content-Security-Policy: the site renders with critical
      # CSS only, and no dev-server check can see it.
      - name: Build (production) + CSP guard
        working-directory: 05_Website_Angular/client
        run: npm run build

  server:
    name: Server — type-check & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: 05_Website_Angular/server/package-lock.json
      - name: Install dependencies
        working-directory: 05_Website_Angular/server
        run: npm ci
      - name: Type-check
        working-directory: 05_Website_Angular/server
        run: npx tsc -p tsconfig.json --noEmit
      - name: Matching-engine tests
        working-directory: 05_Website_Angular/server
        run: npm test

  api:
    name: Server — API, email & extraction tests
    runs-on: ubuntu-latest
    # Boots the real server against a throwaway PostgreSQL and drives it
    # over HTTP, so guards, sessions and SQL are exercised as deployed.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: 05_Website_Angular/server/package-lock.json
      - name: Install dependencies
        working-directory: 05_Website_Angular/server
        run: npm ci
      - name: API integration tests
        working-directory: 05_Website_Angular/server
        env:
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_USER: postgres
          DB_PASS: postgres
        run: npm run test:api

      # Delivery is proven against a local SMTP sink, and extraction against a
      # local stand-in for the Gemini API — no credentials, no network, and
      # nothing that costs money to run on every pull request.
      - name: Email delivery tests
        working-directory: 05_Website_Angular/server
        env:
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_USER: postgres
          DB_PASS: postgres
        run: npm run test:email

      - name: AI extraction tests
        working-directory: 05_Website_Angular/server
        env:
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_USER: postgres
          DB_PASS: postgres
        run: npm run test:analyze
